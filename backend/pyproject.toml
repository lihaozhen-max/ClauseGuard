[project]
name = "clauseguard-backend"
version = "0.1.0"
description = "ClauseGuard 合同审批审查系统 — 工具服务（FastAPI）"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Web 框架 / ASGI
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    # 数据校验 / 配置（CF-22）
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    # ORM / MySQL（OPEN-01：异步 asyncmy + 同步 pymysql 兜底）
    "sqlalchemy>=2.0.54",
    "asyncmy>=0.2.14",
    "pymysql>=1.2.0",
    "alembic>=1.20.0",
    # HTTP 客户端（审批系统 / LLM）
    "httpx>=0.28.1",
    "openai>=3.14.1",
    # 文档解析（M2）
    "pymupdf>=1.28.2",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    "pillow>=12.3.0",
    # OCR（M2）—— 仅在 Python 3.13 有轮子，3.14 无解（见设计 R1）
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv]
# 纯应用工程，不需要构建后端；包目录为 app/（非 src 布局）
package = false

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "requires_db: 需要本机 MySQL（database/docker-compose.yml）在运行的集成用例",
    "mock: 针对模拟审批系统（mock-approval-system）的用例",
    "slow: 需要真实 OCR 推理（单页约 60s）的用例，迭代时可用 -m \"not slow\" 跳过",
    "llm: 需要真实调用 LLM 端点的用例（无 Key 时自动跳过），迭代时可用 -m \"not llm\" 跳过",
]
